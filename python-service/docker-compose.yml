services:
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: flashbuy
      POSTGRES_PASSWORD: flashbuy
      POSTGRES_DB: flashbuy
    ports:
      - "5432:5432"
    volumes:
      - flashbuy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashbuy -d flashbuy"]
      interval: 2s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxclients", "20000"]
    ports:
      - "6379:6379"
    volumes:
      - flashbuy_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 20

  app1: &app
    build: .
    hostname: app1
    environment: &app_env
      DATABASE_URL: postgresql+asyncpg://flashbuy:flashbuy@postgres:5432/flashbuy
      REDIS_URL: redis://redis:6379/0
      REDIS_PUBSUB_MAX_CONNECTIONS: "2048"
      DB_POOL_SIZE: "15"
      DB_MAX_OVERFLOW: "20"
      INSTANCE_ID: app1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  app2:
    <<: *app
    hostname: app2
    environment:
      <<: *app_env
      INSTANCE_ID: app2

  app3:
    <<: *app
    hostname: app3
    environment:
      <<: *app_env
      INSTANCE_ID: app3

  lb:
    image: caddy:2-alpine
    ports:
      - "8000:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - app1
      - app2
      - app3
    restart: on-failure

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app1
      - app2
      - app3

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  locust:
    build: .
    command: locust -f locustfile.py --host http://lb:80
    ports:
      - "8089:8089"
    depends_on:
      - lb
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

volumes:
  flashbuy_pgdata:
  flashbuy_redis:
