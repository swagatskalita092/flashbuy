services:
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: flashbuy
      POSTGRES_PASSWORD: flashbuy
      POSTGRES_DB: flashbuy
    ports:
      - "5432:5432"
    volumes:
      - flashbuy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashbuy -d flashbuy"]
      interval: 2s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxclients", "20000"]
    ports:
      - "6379:6379"
    volumes:
      - flashbuy_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 20

  # Phase 6: durable event delivery. See docs/ENGINEERING_JOURNAL.md.
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI (guest/guest is disabled remotely; use flashbuy/flashbuy)
    environment:
      RABBITMQ_DEFAULT_USER: flashbuy
      RABBITMQ_DEFAULT_PASS: flashbuy
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Fulfillment Service's own database. Deliberately a separate container,
  # not a separate schema on `postgres` above - see fulfillment-service/README.md.
  postgres-fulfillment:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fulfillment
      POSTGRES_PASSWORD: fulfillment
      POSTGRES_DB: fulfillment
    ports:
      # 5433 is already used by the `postgres-test` profile below - do not
      # reuse it (that exact collision is how this was caught: docker
      # refused to start postgres-test with "port is already allocated").
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fulfillment -d fulfillment"]
      interval: 2s
      timeout: 5s
      retries: 20

  app1: &app
    build: .
    hostname: app1
    environment: &app_env
      DATABASE_URL: postgresql+asyncpg://flashbuy:flashbuy@postgres:5432/flashbuy
      REDIS_URL: redis://redis:6379/0
      REDIS_PUBSUB_MAX_CONNECTIONS: "2048"
      DB_POOL_SIZE: "15"
      DB_MAX_OVERFLOW: "20"
      INSTANCE_ID: app1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  app2:
    <<: *app
    hostname: app2
    environment:
      <<: *app_env
      INSTANCE_ID: app2

  app3:
    <<: *app
    hostname: app3
    environment:
      <<: *app_env
      INSTANCE_ID: app3

  lb:
    image: caddy:2-alpine
    ports:
      - "8000:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - app1
      - app2
      - app3
    restart: on-failure

  # Phase 6: the only process that talks to RabbitMQ for `order.confirmed`
  # events. Polls outbox_events written by app1-3's /orders/{id}/confirm.
  outbox-publisher:
    build: .
    command: ["python", "-m", "app.outbox_publisher"]
    environment:
      DATABASE_URL: postgresql+asyncpg://flashbuy:flashbuy@postgres:5432/flashbuy
      RABBITMQ_URL: amqp://flashbuy:flashbuy@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  # Follow-up to Phase 6: deletes published outbox_events rows older than
  # OUTBOX_RETENTION_DAYS (default 7). Never touches an unpublished row,
  # regardless of age - see app/outbox_retention.py and
  # docs/failure-modes.md #5.
  outbox-retention:
    build: .
    command: ["python", "-m", "app.outbox_retention"]
    environment:
      DATABASE_URL: postgresql+asyncpg://flashbuy:flashbuy@postgres:5432/flashbuy
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  fulfillment-consumer:
    build: ../fulfillment-service
    command: ["python", "-m", "app.consumer"]
    environment:
      DATABASE_URL: postgresql+psycopg2://fulfillment:fulfillment@postgres-fulfillment:5432/fulfillment
      RABBITMQ_URL: amqp://flashbuy:flashbuy@rabbitmq:5672/
    depends_on:
      postgres-fulfillment:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  fulfillment-api:
    build: ../fulfillment-service
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql+psycopg2://fulfillment:fulfillment@postgres-fulfillment:5432/fulfillment
    depends_on:
      postgres-fulfillment:
        condition: service_healthy
    restart: on-failure

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app1
      - app2
      - app3

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  locust:
    build: .
    command: locust -f locustfile.py --host http://lb:80
    ports:
      - "8089:8089"
    depends_on:
      - lb
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # Isolated pytest deps. Not started by a normal `docker compose up`.
  # Tests run on every push and pull request through .github/workflows/tests.yml.
  # This profile is Postgres + Redis only, no admission-loop replicas.
  postgres-test:
    profiles: ["test"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flashbuy
      POSTGRES_PASSWORD: flashbuy
      POSTGRES_DB: flashbuy
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashbuy -d flashbuy"]
      interval: 2s
      timeout: 5s
      retries: 20

  redis-test:
    profiles: ["test"]
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 20

  test-runner:
    profiles: ["test"]
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://flashbuy:flashbuy@postgres-test:5432/flashbuy
      REDIS_URL: redis://redis-test:6379/15
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    command: ["pytest", "-vv"]

volumes:
  flashbuy_pgdata:
  flashbuy_redis:
